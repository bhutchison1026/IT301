<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Forms</title>
    <!--linking an external stylesheet-->
    <link rel="stylesheet" href="style.css">
    <!--internal styles to apply to the whole page-->
    <style>
        label, h1{
            color:purple;
        }
    </style>
</head>
<body>
    <!--inline style option-->
    <h1 style="color:navy">Practice Forms</h1>
    <form action="/login" >
        <!--"for" attribute links the label to the input field, required -->
        <fieldset>
            <label for="username">Username:</label>
            <input id="username" type="text" name="username" placeholder="Enter username here.">
            <br><br>
            <label for="password">Password:</label>
            <input id="password" type="password" name="password" placeholder="Enter password here.">
        </fieldset>
    <!--style changes are referenced from top to bottom, later changes override previous settings-->
    <h1>howdy howdy howdy</h1>
    </form>

    <ul>
        <li id="colors">red</li>
        <ol>
            <li id="colors">apple</li>
            <li id="colors">tomato</li>
        </ol>
        <li id="colors">green</li>
        <li> </li>
        <li id="colors">blue</li>
    </ul>
</body>
</html>
